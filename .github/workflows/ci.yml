name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Laravel)
    runs-on: ubuntu-latest
    # Run against the real target database, not the SQLite default in phpunit.xml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: underwriting_test
          POSTGRES_USER: underwriting
          POSTGRES_PASSWORD: underwriting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U underwriting" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: underwriting_test
      DB_USERNAME: underwriting
      DB_PASSWORD: underwriting
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  ai-service:
    name: ai-service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  compose:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          APP_KEY: base64:ci-only-not-a-secret
      - run: docker compose build
        env:
          APP_KEY: base64:ci-only-not-a-secret
